# Name of your workflow
name: CI-CD Docker Pipeline

# 1. Define the trigger
# This workflow runs on any push to the 'main' branch
on:
  push:
    branches:
      - main

# 2. Define the jobs
jobs:
  build-and-push:
    # Use the latest Ubuntu runner
    runs-on: ubuntu-latest
    
    steps:
      # --- CI PART (Build) ---

      # 1. Check out your repository code
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (a modern builder)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub
      # Uses the secrets you created in GitHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- CD PART (Push) ---

      # 4. Build the Docker image and push it to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .         # Use the root directory as build context
          push: true         # Actually push the image (CD)
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/furnitureclassification:latest 